version: 2

sources:
  - name: olist
    description: >
      The Brazilian E-Commerce Public Dataset by Olist (Kaggle, olistbr/brazilian-ecommerce),
      loaded as-is into BigQuery by scripts/load_raw_to_bigquery.sh. Nine tables, about
      100,000 orders from September 2016 to October 2018, values in Brazilian reais.
      Licence CC BY-NC-SA 4.0.
    schema: "{{ var('raw_dataset') }}"
    meta:
      # Used by dbt-duckdb only; BigQuery reads the loaded tables.
      external_location: "read_csv('data/raw/{name}.csv', header = true, quote = '\"', escape = '\"')"
    tables:
      - name: olist_orders_dataset
        description: One row per order, with its status and lifecycle timestamps.
        columns:
          - name: order_id
            tests: [unique, not_null]
      - name: olist_order_items_dataset
        description: One row per item in an order.
      - name: olist_order_payments_dataset
        description: One row per payment instalment line on an order.
      - name: olist_order_reviews_dataset
        description: Customer satisfaction surveys sent after delivery.
      - name: olist_customers_dataset
        description: One row per customer_id, which Olist issues per order.
        columns:
          - name: customer_id
            tests: [unique, not_null]
      - name: olist_sellers_dataset
        description: One row per seller.
      - name: olist_products_dataset
        description: One row per product.
      - name: olist_geolocation_dataset
        description: Latitude and longitude points per zip code prefix. Many points per prefix.
      - name: product_category_name_translation
        description: Portuguese to English category names.
