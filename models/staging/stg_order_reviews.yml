version: 2

models:
  - name: stg_order_reviews
    description: >
      One row per review survey line, renamed and typed. review_id is not unique
      on its own: Olist sometimes sends one survey for several orders, and some
      orders got more than one survey.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [review_id, order_id]
    columns:
      - name: review_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: review_comment_title
      - name: review_comment_message
      - name: review_created_at
        description: When the survey was sent (midnight).
      - name: review_answered_at
