version: 2

models:
  - name: stg_order_items
    description: One row per item in an order, renamed and typed. Prices in R$.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        description: Position of the item within the order, starting at 1.
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]
      - name: shipping_limit_at
      - name: price
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: freight_value
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
