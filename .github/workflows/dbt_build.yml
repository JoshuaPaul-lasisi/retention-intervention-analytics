name: dbt build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dbt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      DBT_TARGET: duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt (exact versions from requirements.txt)
        run: pip install -r requirements.txt

      - name: Cache Olist data
        uses: actions/cache@v4
        with:
          path: data/raw/*.csv
          key: olist-raw-v1

      - name: Download Olist data
        run: |
          if [ ! -f data/raw/olist_orders_dataset.csv ]; then
            ./scripts/download_olist_data.sh
          fi

      - name: dbt deps
        run: dbt deps

      - name: dbt build
        run: dbt build

      - name: Compile the voucher readout
        run: dbt compile -s voucher_test_readout

      - name: Build the site (dashboard data and model docs)
        run: |
          python scripts/export_dashboard_data.py
          dbt docs generate --static
          mkdir -p site/docs
          cp target/static_index.html site/docs/index.html
          touch site/.nojekyll

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish dashboard and docs"
