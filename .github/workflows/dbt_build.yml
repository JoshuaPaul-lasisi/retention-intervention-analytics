name: dbt build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      DBT_TARGET: duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install "dbt-core>=1.10,<2.0" "dbt-duckdb>=1.10,<2.0"

      - name: Cache Olist data
        uses: actions/cache@v4
        with:
          path: data/raw/*.csv
          key: olist-raw-v1

      - name: Download Olist data
        run: |
          if [ ! -f data/raw/olist_orders_dataset.csv ]; then
            ./scripts/download_olist_data.sh
          fi

      - name: dbt deps
        run: dbt deps

      - name: dbt build
        run: dbt build

      - name: Compile the voucher readout
        run: dbt compile -s voucher_test_readout
